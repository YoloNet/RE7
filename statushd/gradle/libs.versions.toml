# StatusHD — Aplikasi Android Native (Kotlin + Jetpack Compose)
# v1.0.0 (versionCode 1). Clean-room rebuild of PureStatus' functions.
# applicationId com.statushd.app (working — Jean can rename before launch).
# Versions mirror the proven kuv2 baseline (Jean built it in Android Studio);
# the only new dependency is ffmpeg-kit-full, verified on Maven Central
# (latest/release 6.0-2.LTS, AAR exists).

[versions]
agp = "9.5.0"
kotlin = "2.4.10"
gradle = "9.8.2"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# Jetpack Compose (BOM mengurus versi serasi antara library Compose)
composeBom = "2025.05.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
materialIconsExtended = "1.7.8"

# Data tempatan
room = "2.7.0"
datastore = "1.1.1"

# Media: FFmpegKit (on-device compression, same engine family as the original)
ffmpegKit = "6.0-2.LTS"

# Lain-lain
kotlinxCoroutines = "1.10.1"

# Java 8+ API desugaring (java.time pada minSdk 24)
desugarJdkLibs = "2.1.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.13.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
ffmpeg-kit-full = { group = "com.arthenica", name = "ffmpeg-kit-full", version.ref = "ffmpegKit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP 2.4.0 does not exist in the plugin portal; 2.3.13 is the current stable AGP 9-compatible release.
ksp = { id = "com.google.devtools.ksp", version = "2.3.13" }
